# Local development database for RunningAI.
#
#   docker compose up -d
#   docker compose ps
#   docker compose down          # keep data
#   docker compose down -v       # drop data volume
#
# Defaults below are development-only. Override them in a repository-root .env
# (git-ignored, see .env.example); docker compose reads it automatically.
services:
  postgres:
    image: postgres:17
    container_name: running-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-running_ai}
      POSTGRES_USER: ${POSTGRES_USER:-running_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-running_ai}
    ports:
      # Loopback ONLY (Phase 7E-4, RISK-H3). Without the host IP Docker publishes on every
      # interface (0.0.0.0 and [::]), and Docker Desktop's publishing bypasses the Windows
      # Firewall - which is how 5432 came to accept cleartext superuser connections from the LAN
      # and the tailnet (measured in Phase 7D-2, re-measured in 7E-3). Every known client is on
      # this host: production Spring, the dev instances, and `docker exec psql` (which never
      # leaves the container). Pair this with DB_URL=jdbc:postgresql://127.0.0.1:5432/... because
      # `localhost` resolves to ::1 first here and this binding publishes IPv4 only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - running_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-running_ai} -d ${POSTGRES_DB:-running_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  running_ai_postgres_data:
