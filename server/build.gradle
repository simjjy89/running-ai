plugins {
    id 'java'
    // Kotlin is the primary language for new AI-coach code (Phase 6E) only; the existing Java
    // code stays Java. The Kotlin version is the one Spring Boot 3.5.16 already manages for
    // kotlin-reflect/kotlin-stdlib, so plugin and runtime library versions cannot drift apart.
    id 'org.jetbrains.kotlin.jvm' version '2.1.21'
    // Makes Spring-annotated Kotlin classes open and gives @ConfigurationProperties/@Entity
    // classes a no-arg constructor, so no Kotlin class has to be manually marked `open`.
    id 'org.jetbrains.kotlin.plugin.spring' version '2.1.21'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.1.21'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.runningai'
version = '0.0.1-SNAPSHOT'
description = 'RunningAI server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:1.1.8'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // MCP server (Phase 6C): Spring AI 1.1.x is the line built for Spring Boot 3.5 (2.x requires Boot 4). Off by default.
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Kotlin (Phase 6E). Versions come from the Spring Boot BOM, not pinned here.
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    compilerOptions {
        // Strict JSR-305: Java types annotated @Nullable/@NonNull are treated as genuinely
        // nullable/non-null in Kotlin instead of as platform types, so the Java interop boundary
        // is checked by the compiler rather than at runtime.
        freeCompilerArgs.addAll('-Xjsr305=strict')
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
    jvmToolchain(21)
}

tasks.named('test') {
    useJUnitPlatform {
        // Live Claude CLI evaluation is opt-in: it calls the real CLI and costs money, so it is
        // never part of `gradlew test`. Run it with -PliveCoachEval (see the Phase 6E work order).
        if (!project.hasProperty('liveCoachEval')) {
            excludeTags 'live-coach'
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
