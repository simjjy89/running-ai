spring:
  application:
    name: running-ai
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mappings match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # JSON column type used by migrations. PostgreSQL: JSONB (overridden to JSON for H2 tests).
      json_type: JSONB
  jackson:
    default-property-inclusion: non_null
  ai:
    mcp:
      server:
        # MCP server (Spring AI 1.1.x, Phase 6C). Its own default is ON; RunningAI turns it on exactly when at
        # least one tool group is enabled - running-ai.mcp.enabled (write adapter, publish_workout) OR
        # running-ai.mcp.read-enabled (Phase 7C-2a read-only tools) OR running-ai.mcp.train-enabled (Phase 7F-1
        # draft/approve/publish lifecycle tools). YAML cannot express that OR, so the effective
        # value is computed by McpServerSwitchEnvironmentPostProcessor (which overrides this line); the binding
        # below is kept as documentation of the pre-7C-2a behaviour and as a fallback. Streamable HTTP in
        # stateless mode on POST /mcp; only explicitly registered tools are exposed (no resources / prompts /
        # completions / annotation scanning). No authentication: never expose /mcp to the public Internet.
        enabled: ${running-ai.mcp.enabled}
        protocol: STATELESS
        type: SYNC
        name: running-ai
        version: 0.0.1
        streamable-http:
          mcp-endpoint: /mcp
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

running-ai:
  mcp:
    # Switch of the WRITE MCP adapter (publish_workout; also one of the two switches that turn the Spring AI MCP
    # server above on). OFF by default. Even when on, a publish still needs running-ai.workout-publishing.enabled=true:
    # the tool goes through WorkoutPublishApplicationService.
    enabled: ${RUNNINGAI_MCP_ENABLED:false}
    # Switch of the READ-ONLY MCP tools (Phase 7C-2a: get_recent_activities, get_activity_analysis,
    # get_training_context, get_recovery_context, get_fitness_trend, get_workout_recommendation,
    # get_athlete_profile). OFF by default, and INDEPENDENT of the write switch: with only this on,
    # publish_workout is not registered at all. The tools read stored data only - no DB change, no
    # Garmin/Intervals call, no draft, no publish, no sync or re-analysis trigger.
    read-enabled: ${RUNNINGAI_MCP_READ_ENABLED:false}
    # Switch of the TRAINING-LIFECYCLE MCP tools (Phase 7F-1: create_workout_draft, get_workout_draft,
    # revise_workout_draft, approve_workout_draft, preview_draft_publish, publish_approved_draft).
    # OFF by default and independent of the two switches above. These tools WRITE: they store drafts,
    # record the athlete's approval and - for publish_approved_draft only - send an approved workout
    # to Intervals.icu. Turning this on is still not enough to publish: publish_approved_draft goes
    # through ApprovedWorkoutDraftPublishService, which refuses while running-ai.draft-publishing.enabled
    # is false (and that flag cannot be true at the same time as workout-publishing.enabled).
    train-enabled: ${RUNNINGAI_MCP_TRAIN_ENABLED:false}
  default-athlete:
    name: ${RUNNING_AI_ATHLETE_NAME:default}
    timezone: ${RUNNING_AI_ATHLETE_TIMEZONE:Asia/Seoul}
  garmin:
    connector:
      # Localhost Python connector (tools/garmin-connector). Holds no Garmin credentials.
      base-url: ${GARMIN_CONNECTOR_URL:http://127.0.0.1:8765}
      connect-timeout: 2s
      read-timeout: 30s
    detail:
      # Per-activity detail collection (Phase 6H-1A/6H-1C). Garmin caps its sample stream at the
      # requested maxChartSize and down-samples beyond it: a live 2783 s run returned 1399 of its 2784
      # native points at the library default of 2000, and all 2784 at 20000. 20000 is therefore the
      # default so streams are collected at full resolution; raise or lower it only deliberately
      # (the connector accepts 1..100000 and startup fails outside that range).
      # Asking for 20000 does NOT make a stream complete: completeness is read back out of the
      # response (totalMetricsCount) and recorded per collection as FULL / DOWNSAMPLED / UNKNOWN.
      samples-max-chart-size: ${GARMIN_DETAIL_SAMPLES_MAX_CHART_SIZE:20000}
    sync:
      # Incremental sync (GarminIncrementalSyncService): page size per connector call,
      # overlap re-fetched behind the high-water mark (late Garmin edits/uploads), and
      # a page cap so a stalled cutoff cannot page through history forever.
      page-size: 50
      overlap: 7d
      max-pages: 10
      circuit-breaker:
        # Phase 8B. Stops the SCHEDULER from repeating an automatic sync that is provably going
        # nowhere - Phase 8A counted the failures, nothing read the count, so a rejected Garmin
        # session produced 24 authentication failures a day indefinitely.
        # It never blocks POST /api/v1/garmin/sync: a human asking for a sync is the intervention
        # the breaker is waiting for, and a completed attempt is what clears an auth block.
        # Skipping an automatic tick loses no data - the next sync re-reads the 7d overlap.
        enabled: ${RUNNING_AI_GARMIN_CIRCUIT_BREAKER_ENABLED:true}
        # 401/403 never heals by waiting, so this is low and the block has NO expiry: only a
        # completed attempt (in practice a manual sync after renewing the connector session)
        # lifts it.
        auth-failure-threshold: 3
        # 429 means slow down, so back off on the first one.
        rate-limit-failure-threshold: 1
        rate-limit-cooldown: 6h
        # Connector restarts and flaky nights must NOT stop collection, hence the high count.
        transient-failure-threshold: 8
        transient-cooldown: 2h
        # A PARTIAL run holds the checkpoint back, so repeating it re-reads the same window and
        # re-hits the same unmappable item. Counted separately from failures (it is not one).
        partial-threshold: 6
        partial-cooldown: 12h
        # Floor between two automatic attempts whatever the schedule says, so a misconfigured
        # fixed-delay can only make ticks arrive and be skipped, never flood Garmin.
        minimum-interval: 15m
    scheduler:
      # Automatic incremental sync (GarminSyncScheduler). OFF by default so that starting the
      # server (tests, CI, PCs without a Garmin token) never calls Garmin. Enable on the
      # operating PC with RUNNING_AI_GARMIN_SCHEDULER_ENABLED=true; needs the local connector.
      enabled: false
      fixed-delay: 1h
      initial-delay: 1m
    profile-sync:
      # Automatic Garmin athlete intensity-profile sync (Phase 6D, GarminProfileSyncScheduler).
      # No master switch (the manual POST /api/v1/garmin/profile-sync always works); only the
      # automatic trigger is gated, OFF by default so starting the server never calls Garmin.
      # Independent of the activity sync scheduler and of workout-publishing: never bypasses
      # either, and workout publishing never depends on this succeeding.
      scheduler:
        enabled: ${GARMIN_PROFILE_SYNC_ENABLED:false}
        cron: ${GARMIN_PROFILE_SYNC_SCHEDULER_CRON:0 30 4 * * *}
        zone: ${GARMIN_PROFILE_SYNC_SCHEDULER_ZONE:Asia/Seoul}
    recovery-sync:
      # Garmin recovery metrics (Phase 6F: HRV, sleep, resting HR, Body Battery, stress). Manual only
      # (POST /api/v1/garmin/recovery-sync[/backfill]); there is no scheduler. A backfill is strictly
      # sequential (5 Garmin calls per day), pauses between days, never retries and stops at the first
      # connector failure (e.g. 429).
      backfill-delay: ${GARMIN_RECOVERY_BACKFILL_DELAY:2s}
      max-backfill-days: 28
      # Largest window GET /api/v1/garmin/recovery-sync/coverage may report over (Phase 8A). Much
      # larger than max-backfill-days on purpose: the coverage report is database-only, so looking
      # further back costs one query and no Garmin call.
      max-coverage-days: 365

  intervals:
    # Intervals.icu workout publisher (IntervalsWorkoutPublisher). The API key comes from the environment only.
    base-url: https://intervals.icu
    # 0 = the athlete that owns the API key (Intervals.icu shortcut)
    athlete-id: ${INTERVALS_ATHLETE_ID:0}
    api-key: ${INTERVALS_API_KEY:}
    connect-timeout: 3s
    read-timeout: 15s
    activity-import:
      # Import of activities that exist ONLY in Intervals.icu (Phase 7E-1,
      # POST /api/v1/intervals/activity-import). Read-only towards Intervals.icu; it cannot publish.
      # OFF by default: this is the only path in the repo that creates activity rows from a source
      # other than Garmin, and it also refuses to start while any publishing switch or Garmin
      # scheduler is on. No scheduler, no startup run, no MCP tool - an explicit POST is the only
      # trigger, and re-POSTing is both the resume and the retry.
      enabled: ${RUNNING_AI_INTERVALS_ACTIVITY_IMPORT_ENABLED:false}
      max-range-days: 120
      max-activities: 200
      activity-delay: 1s

  strava:
    archive-import:
      # Import of the athlete's own Strava data export (Phase 7E-2,
      # POST /api/v1/strava/archive-import). The source is a LOCAL DIRECTORY, not an API: these
      # activities are unreachable over any API (Intervals.icu answers 422 "Cannot read Strava
      # activities via the API" for every one of them), and no Strava HTTP client exists in this repo.
      # OFF by default for the same reason as the Intervals importer - it creates activity rows - and
      # it refuses to start while any publishing switch or Garmin scheduler is on. No scheduler, no
      # startup run, no MCP tool; re-POSTing is both the resume and the retry.
      enabled: ${RUNNING_AI_STRAVA_ARCHIVE_IMPORT_ENABLED:false}
      # Directory holding the unpacked export (activities.csv + activities/). MUST live outside the
      # repository: the export contains the athlete's real GPS traces. Read-only, never written to.
      archive-path: ${RUNNING_AI_STRAVA_ARCHIVE_PATH:}
      max-activities: 200

  historical-backfill:
    # Manual 90-day historical backfill (Phase 6H-6, POST /api/v1/historical-backfill). No scheduler, no
    # auto-resume. activity-delay sits between two activities whose detail is actually fetched from
    # Garmin; the discovery caps PAUSE the run (BACKFILL_DISCOVERY_LIMIT_EXCEEDED) instead of silently
    # truncating it. Recovery days reuse running-ai.garmin.recovery-sync.backfill-delay.
    page-size: 100
    max-pages: 20
    max-activities: 500
    activity-delay: ${HISTORICAL_BACKFILL_ACTIVITY_DELAY:2s}

  workout-publishing:
    # Manual workout publish trigger (WorkoutPublishApplicationService, POST /api/v1/workout-publish). OFF by default:
    # do not enable while the legacy main-PC workout publisher is still active (two writers on one calendar).
    enabled: ${WORKOUT_PUBLISHING_ENABLED:false}
    scheduler:
      # Automatic daily trigger (WorkoutPublishingScheduler); calls only WorkoutPublishApplicationService. OFF by default and
      # independent of the master switch above (which it never bypasses). Enable only after the legacy main-PC writer is
      # disabled AND a manual POST smoke test passed. No retry, no catch-up of missed runs.
      enabled: ${WORKOUT_PUBLISHING_SCHEDULER_ENABLED:false}
      cron: ${WORKOUT_PUBLISHING_SCHEDULER_CRON:0 0 5 * * *}
      zone: ${WORKOUT_PUBLISHING_SCHEDULER_ZONE:Asia/Seoul}

  draft-publishing:
    # Publishing APPROVED AI-coach drafts (Phase 6G, POST /api/v1/workout-drafts/{id}/publish). OFF by default and
    # independent of workout-publishing above (the legacy date-based deterministic path): neither switch implies the
    # other. With it off, drafts can still be generated, revised, approved and previewed. There is no scheduler and no
    # MCP tool for it; an approved REST day is recorded as SKIPPED_REST_DAY and never sent anywhere.
    # Legacy XOR draft (Phase 6G.1): with workout-publishing.enabled also true, startup fails (PublishingModeGuard).
    enabled: ${RUNNING_AI_DRAFT_PUBLISHING_ENABLED:false}

  coach:
    # AI coach (Phase 6E). Designs workout DRAFTS only: nothing in this path can publish to
    # Intervals or write to Garmin, whatever running-ai.workout-publishing.enabled is set to.
    # Holds no credential: the Claude provider uses the Claude Code CLI's own login session on
    # this host (no ANTHROPIC_API_KEY is read, stored or forwarded anywhere).
    provider: ${RUNNING_AI_COACH_PROVIDER:CLAUDE}
    # Which CoachTrainingContext CoachTrainingContextBuilder builds (Phase 6H-7). V1 is the source
    # default everywhere; the Main PC sets this to V2 only after its live validation passes.
    context-version: ${RUNNING_AI_TRAINING_CONTEXT_VERSION:V1}
    context-v2:
      max-recent-activities: ${RUNNING_AI_COACH_CONTEXT_V2_MAX_RECENT_ACTIVITIES:8}
      max-interval-groups-per-activity: ${RUNNING_AI_COACH_CONTEXT_V2_MAX_INTERVAL_GROUPS:3}
      max-snapshot-bytes: ${RUNNING_AI_COACH_CONTEXT_V2_MAX_SNAPSHOT_BYTES:65536}
    injury-history:
      # What the athlete's own injury/pain ledger contributes to a coach prompt (Phase 7F-3A).
      # Caps only: the Phase 7B-2 safety gate is unaffected by every value here, and an omitted
      # report is counted in the context (omittedReportCount), never silently dropped.
      history-window-days: ${RUNNING_AI_COACH_INJURY_HISTORY_WINDOW_DAYS:180}
      max-previous-reports: ${RUNNING_AI_COACH_INJURY_HISTORY_MAX_PREVIOUS_REPORTS:4}
      # Longest free-text note excerpt carried (latest report only). 0 = no free text at all.
      max-notes-excerpt-chars: ${RUNNING_AI_COACH_INJURY_HISTORY_MAX_NOTES_CHARS:200}
    claude:
      command: ${RUNNING_AI_COACH_CLAUDE_COMMAND:claude}
      model: ${RUNNING_AI_COACH_CLAUDE_MODEL:sonnet}
      timeout: ${RUNNING_AI_COACH_CLAUDE_TIMEOUT:120s}
      max-output-bytes: 1048576
      max-error-bytes: 65536
    validation:
      # Hard-safety bounds only (malformed/nonsense output), never coaching policy: they are set
      # far outside anything a real session would use so they cannot second-guess the coach.
      max-total-duration-minutes: 300
      min-total-duration-minutes: 5
      pace-plausibility-tolerance: 0.5
      heart-rate-plausibility-tolerance: 0.5

  coach-refresh:
    # Coach data refresh pipeline (Phase 6H-9, POST /api/v1/coach/data-refresh). Keeps the RunningAI
    # DB current just before a coach draft is generated: Garmin summary sync -> recent-activity
    # completion (detail/analysis/Intervals) -> Intervals fitness -> Garmin recovery -> DB-only
    # freshness evaluation. A SEPARATE package/service from com.runningai.coach - WorkoutDraftService
    # keeps its existing DB-only, zero-Garmin/Intervals-call contract unchanged; nothing here can
    # write a workout (no IntervalsWorkoutPublisher/Client dependency).
    recent-activity-days: 7
    fitness-refresh-days: 7
    recovery-refresh-days: 2
    max-fitness-age-days: 2
    max-recovery-age-days: 2
    scheduler:
      # Automatic periodic refresh (CoachDataRefreshScheduler). OFF by default, and stays off through
      # this phase's own live validation (work order section 50/74): enable only deliberately.
      enabled: ${RUNNING_AI_COACH_REFRESH_SCHEDULER_ENABLED:false}
      fixed-delay: 1h
      initial-delay: 1m

  injury-safety:
    # Server-enforced athlete-reported injury/pain safety gate (Phase 7B-2), consulted by every
    # workout-producing path (AI-coach draft generation/revision/approval, approved-draft publish,
    # the legacy deterministic publish pipeline and, through it, its scheduler and the MCP tool).
    # No report ever, an UNKNOWN status, an ACTIVE report, or a report older than this many hours
    # all block anything but a REST workout; only an explicit, fresh RESOLVED report allows normal
    # training to be considered. 48h: long enough that a same-day confirmation does not need
    # repeating on every coach call, short enough that a multi-day-old reading is never silently
    # treated as still describing today.
    staleness-hours: ${RUNNING_AI_INJURY_SAFETY_STALENESS_HOURS:48}

  training:
    # Training decision context (TrainingDecisionContextService). Heuristics and descriptive labels only.
    classification:
      # A single RUN / TREADMILL_RUN at least this long is labelled LONG (RunningAI heuristic).
      long-run-min-duration: 90m
    decision:
      # Load trend is STABLE within +/- this percent of weekly load change (descriptive, not a safety band).
      stable-band-percent: 10
      # Calendar days returned as recentPattern (1..28); the history window is fixed at 28 days.
      pattern-days: 14

management:
  endpoints:
    web:
      exposure:
        include: health,info
