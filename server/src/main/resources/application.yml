spring:
  application:
    name: running-ai
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mappings match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # JSON column type used by migrations. PostgreSQL: JSONB (overridden to JSON for H2 tests).
      json_type: JSONB
  jackson:
    default-property-inclusion: non_null

running-ai:
  default-athlete:
    name: ${RUNNING_AI_ATHLETE_NAME:default}
    timezone: ${RUNNING_AI_ATHLETE_TIMEZONE:Asia/Seoul}

management:
  endpoints:
    web:
      exposure:
        include: health,info
