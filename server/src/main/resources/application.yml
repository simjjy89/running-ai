spring:
  application:
    name: running-ai
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mappings match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # JSON column type used by migrations. PostgreSQL: JSONB (overridden to JSON for H2 tests).
      json_type: JSONB
  jackson:
    default-property-inclusion: non_null
  ai:
    mcp:
      server:
        # MCP server (Spring AI 1.1.x, Phase 6C). Its own default is ON, so it is tied to running-ai.mcp.enabled
        # (RUNNINGAI_MCP_ENABLED, default false). Streamable HTTP in stateless mode on POST /mcp; only the explicitly
        # registered publish_workout tool is exposed (no resources / prompts / completions / annotation scanning).
        # No authentication: never expose /mcp to the public Internet.
        enabled: ${running-ai.mcp.enabled}
        protocol: STATELESS
        type: SYNC
        name: running-ai
        version: 0.0.1
        streamable-http:
          mcp-endpoint: /mcp
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

running-ai:
  mcp:
    # Master switch of the MCP adapter (also switches the Spring AI MCP server above). OFF by default. Even when on, a
    # publish still needs running-ai.workout-publishing.enabled=true: the tool goes through WorkoutPublishApplicationService.
    enabled: ${RUNNINGAI_MCP_ENABLED:false}
  default-athlete:
    name: ${RUNNING_AI_ATHLETE_NAME:default}
    timezone: ${RUNNING_AI_ATHLETE_TIMEZONE:Asia/Seoul}
  garmin:
    connector:
      # Localhost Python connector (tools/garmin-connector). Holds no Garmin credentials.
      base-url: ${GARMIN_CONNECTOR_URL:http://127.0.0.1:8765}
      connect-timeout: 2s
      read-timeout: 30s
    sync:
      # Incremental sync (GarminIncrementalSyncService): page size per connector call,
      # overlap re-fetched behind the high-water mark (late Garmin edits/uploads), and
      # a page cap so a stalled cutoff cannot page through history forever.
      page-size: 50
      overlap: 7d
      max-pages: 10
    scheduler:
      # Automatic incremental sync (GarminSyncScheduler). OFF by default so that starting the
      # server (tests, CI, PCs without a Garmin token) never calls Garmin. Enable on the
      # operating PC with RUNNING_AI_GARMIN_SCHEDULER_ENABLED=true; needs the local connector.
      enabled: false
      fixed-delay: 1h
      initial-delay: 1m
    profile-sync:
      # Automatic Garmin athlete intensity-profile sync (Phase 6D, GarminProfileSyncScheduler).
      # No master switch (the manual POST /api/v1/garmin/profile-sync always works); only the
      # automatic trigger is gated, OFF by default so starting the server never calls Garmin.
      # Independent of the activity sync scheduler and of workout-publishing: never bypasses
      # either, and workout publishing never depends on this succeeding.
      scheduler:
        enabled: ${GARMIN_PROFILE_SYNC_ENABLED:false}
        cron: ${GARMIN_PROFILE_SYNC_SCHEDULER_CRON:0 30 4 * * *}
        zone: ${GARMIN_PROFILE_SYNC_SCHEDULER_ZONE:Asia/Seoul}
    recovery-sync:
      # Garmin recovery metrics (Phase 6F: HRV, sleep, resting HR, Body Battery, stress). Manual only
      # (POST /api/v1/garmin/recovery-sync[/backfill]); there is no scheduler. A backfill is strictly
      # sequential (5 Garmin calls per day), pauses between days, never retries and stops at the first
      # connector failure (e.g. 429).
      backfill-delay: ${GARMIN_RECOVERY_BACKFILL_DELAY:2s}
      max-backfill-days: 28

  intervals:
    # Intervals.icu workout publisher (IntervalsWorkoutPublisher). The API key comes from the environment only.
    base-url: https://intervals.icu
    # 0 = the athlete that owns the API key (Intervals.icu shortcut)
    athlete-id: ${INTERVALS_ATHLETE_ID:0}
    api-key: ${INTERVALS_API_KEY:}
    connect-timeout: 3s
    read-timeout: 15s

  workout-publishing:
    # Manual workout publish trigger (WorkoutPublishApplicationService, POST /api/v1/workout-publish). OFF by default:
    # do not enable while the legacy main-PC workout publisher is still active (two writers on one calendar).
    enabled: ${WORKOUT_PUBLISHING_ENABLED:false}
    scheduler:
      # Automatic daily trigger (WorkoutPublishingScheduler); calls only WorkoutPublishApplicationService. OFF by default and
      # independent of the master switch above (which it never bypasses). Enable only after the legacy main-PC writer is
      # disabled AND a manual POST smoke test passed. No retry, no catch-up of missed runs.
      enabled: ${WORKOUT_PUBLISHING_SCHEDULER_ENABLED:false}
      cron: ${WORKOUT_PUBLISHING_SCHEDULER_CRON:0 0 5 * * *}
      zone: ${WORKOUT_PUBLISHING_SCHEDULER_ZONE:Asia/Seoul}

  coach:
    # AI coach (Phase 6E). Designs workout DRAFTS only: nothing in this path can publish to
    # Intervals or write to Garmin, whatever running-ai.workout-publishing.enabled is set to.
    # Holds no credential: the Claude provider uses the Claude Code CLI's own login session on
    # this host (no ANTHROPIC_API_KEY is read, stored or forwarded anywhere).
    provider: ${RUNNING_AI_COACH_PROVIDER:CLAUDE}
    claude:
      command: ${RUNNING_AI_COACH_CLAUDE_COMMAND:claude}
      model: ${RUNNING_AI_COACH_CLAUDE_MODEL:sonnet}
      timeout: ${RUNNING_AI_COACH_CLAUDE_TIMEOUT:120s}
      max-output-bytes: 1048576
      max-error-bytes: 65536
    validation:
      # Hard-safety bounds only (malformed/nonsense output), never coaching policy: they are set
      # far outside anything a real session would use so they cannot second-guess the coach.
      max-total-duration-minutes: 300
      min-total-duration-minutes: 5
      pace-plausibility-tolerance: 0.5
      heart-rate-plausibility-tolerance: 0.5

  training:
    # Training decision context (TrainingDecisionContextService). Heuristics and descriptive labels only.
    classification:
      # A single RUN / TREADMILL_RUN at least this long is labelled LONG (RunningAI heuristic).
      long-run-min-duration: 90m
    decision:
      # Load trend is STABLE within +/- this percent of weekly load change (descriptive, not a safety band).
      stable-band-percent: 10
      # Calendar days returned as recentPattern (1..28); the history window is fixed at 28 days.
      pattern-days: 14

management:
  endpoints:
    web:
      exposure:
        include: health,info
