# Automated tests: in-memory H2 in PostgreSQL compatibility mode.
# No external services are required to run the test suite.
spring:
  datasource:
    url: jdbc:h2:mem:runningai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

logging:
  level:
    com.runningai: INFO
