# Local development: PostgreSQL (see docker-compose.yml at the repository root).
# Credentials come from the environment. A repository-root .env file (git-ignored,
# see .env.example) is imported as a fallback; real environment variables win.
spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/running_ai}
    username: ${DB_USERNAME:running_ai}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

logging:
  level:
    com.runningai: DEBUG
